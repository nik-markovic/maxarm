<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Desk · MaxArm</title>
  <link rel="stylesheet" href="/common/page.css">
  <link rel="stylesheet" href="/common/view.css">
  <link rel="stylesheet" href="desk.css">
  <script type="module" src="desk.js"></script>
</head>
<body>
<header class="top"></header>

<main class="desk">

  <section class="card view">
    <div class="card-head">
      <h2>The arm, from above</h2>
      <div class="tools">
        <span class="hint">grid, mm</span>
        <div class="seg" id="steps"></div>
        <button class="btn rotate" id="rotate" title="Turn the view a quarter turn, to match how the arm stands">
          ⟳ Rotate view</button>
      </div>
    </div>
    <div class="view-body">
      <canvas id="grid" title="Click to send the cup to that grid point, at the height beside"></canvas>
      <div class="zcol">
        <span class="zlabel">HEIGHT <em id="z-mode"></em></span>
        <output class="num" id="z-out" title="The height the arm is sent to"></output>
        <button class="btn higher" id="z-higher"
          title="Let the slider go 20 mm higher"
          >▲ 20 mm</button>
        <button class="btn safe" id="z-safe" title="Up, clear of anything on the desk"></button>
        <button class="btn zstep" id="z-up" title="1 mm up">Z+</button>
        <div class="zbar">
          <input type="range" class="vertical" id="z-slider" step="1">
          <span class="zscale" id="z-scale"></span>
          <span class="zend top" id="z-top"></span>
          <span class="zend bottom" id="z-bottom"></span>
        </div>
        <button class="btn zstep" id="z-down" title="1 mm down">Z−</button>
        <button class="btn lower" id="z-lower"
          title="Let the slider go 2 mm lower: watch the desk"
          >▼ 2 mm</button>
      </div>
    </div>
    <div class="legend">
      <span><i class="swatch reach"></i>furthest reach</span>
      <span><i class="swatch reach-min"></i>nearest reach</span>
      <span><i class="swatch base"></i>the arm's base</span>
      <span><i class="swatch target"></i>target</span>
      <span><i class="swatch says"></i>arm says</span>
      <span><i class="swatch caution"></i>height: near or on the desk</span>
    </div>
  </section>

  <section class="card arm">
    <div class="card-head">
      <h2>Arm</h2>
      <div class="tools">
        <div class="seg" id="heights">
          <button data-mode="true" title="Where the cup really is">TRUE</button>
          <button data-mode="raw" title="What the arm itself reports">RAW</button>
        </div>
        <span class="info" tabindex="0">?<span class="tip" id="heights-tip"></span></span>
        <button class="btn small" id="copy" title="Copy the target and what the arm says, as shown, as one line">COPY</button>
      </div>
    </div>

    <div class="readout" id="readout">
      <span></span><span id="x-head">X</span><span id="y-head">Y</span><span id="z-head">Z</span>
      <span class="label">Target</span>
      <b class="num" id="target-x"></b><b class="num" id="target-y"></b><b class="num" id="target-z"></b>
      <span class="label says">Arm says<i class="spinner" title="Reading the servos"></i></span>
      <span class="num says" id="says-x"></span><span class="num says" id="says-y"></span>
      <span class="num says" id="says-z"></span>
    </div>
    <div class="desk-line" id="desk-line"></div>

    <div class="nudge">
      <div class="pad">
        <button class="btn" data-dir="up"></button>
        <button class="btn" data-dir="left"></button>
        <span class="hub" id="pad-hub"></span>
        <button class="btn" data-dir="right"></button>
        <button class="btn" data-dir="down"></button>
      </div>
      <button class="btn precise" id="precise"
        title="Land on the target exactly, slowly">PRECISE</button>
      <p class="hint">The arrows nudge the cup the way the view shows. “Arm says” is where the arm reports it is,
        read after every move.</p>
    </div>

    <div class="cup">
      <label>Cup</label>
      <input type="range" id="cup" step="1" value="0">
      <output class="num" id="cup-out"></output>
      <label class="switch"><input type="checkbox" id="suction"><span class="track"></span>Suction</label>
    </div>
    <div class="seal-line" id="seal-line"></div>
  </section>

</main>
<div id="toasts"></div>
</body>
</html>
